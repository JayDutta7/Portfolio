name: Deploy Portfolio

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - production
          - uat
          - dev

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.27.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Determine base href and target environment
        id: config
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *".github.io" ]]; then
            BASE_HREF="/"
          else
            BASE_HREF="/$REPO_NAME/"
          fi
          echo "base_href=$BASE_HREF" >> "$GITHUB_OUTPUT"

          # Determine target environment from manual input or branch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TARGET_ENV="all"
          elif [ "${{ github.ref_name }}" = "uat" ]; then
            TARGET_ENV="uat"
          else
            TARGET_ENV="dev"
          fi
          echo "target_env=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "Selected deployment target: $TARGET_ENV with base href: $BASE_HREF"

      - name: Build Multi-Environment Web
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: |
          set -e
          BASE_HREF="${{ steps.config.outputs.base_href }}"
          TARGET_ENV="${{ steps.config.outputs.target_env }}"
          TEMP_DEPLOY_DIR="/tmp/portfolio_deploy_staging"
          rm -rf "$TEMP_DEPLOY_DIR"
          mkdir -p "$TEMP_DEPLOY_DIR"

          # Helper function to build web
          build_env() {
            local env_name="$1"
            local href="$2"
            local out_dir="$3"

            echo "=========================================="
            echo " Building Environment: $env_name"
            echo " Base Href: $href"
            echo " Output: $out_dir"
            echo "=========================================="

            flutter build web --release \
              --base-href "$href" \
              --dart-define="APP_ENV=$env_name" \
              --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY" \
              --dart-define="FIREBASE_APP_ID=$FIREBASE_APP_ID" \
              --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
              --dart-define="FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" \
              --dart-define="FIREBASE_DATABASE_URL=$FIREBASE_DATABASE_URL" \
              --dart-define="SHOW_VISITOR_BADGE=true"

            mkdir -p "$out_dir"
            cp -r build/web/* "$out_dir/"
          }

          if [ "$TARGET_ENV" = "all" ]; then
            # 1. Build Production for root
            build_env "prod" "$BASE_HREF" "$TEMP_DEPLOY_DIR/prod"

            # 2. Build UAT for /uat/ subpath
            build_env "uat" "${BASE_HREF}uat/" "$TEMP_DEPLOY_DIR/uat"

            # 3. Build DEV for /dev/ subpath
            build_env "dev" "${BASE_HREF}dev/" "$TEMP_DEPLOY_DIR/dev"

            # Assemble into final build/web
            rm -rf build/web
            mkdir -p build/web
            cp -r "$TEMP_DEPLOY_DIR/prod/"* build/web/
            mkdir -p build/web/uat build/web/dev
            cp -r "$TEMP_DEPLOY_DIR/uat/"* build/web/uat/
            cp -r "$TEMP_DEPLOY_DIR/dev/"* build/web/dev/

          elif [ "$TARGET_ENV" = "production" ]; then
            build_env "prod" "$BASE_HREF" "$TEMP_DEPLOY_DIR/prod"
            rm -rf build/web
            mkdir -p build/web
            cp -r "$TEMP_DEPLOY_DIR/prod/"* build/web/

          elif [ "$TARGET_ENV" = "uat" ]; then
            build_env "uat" "$BASE_HREF" "$TEMP_DEPLOY_DIR/uat"
            rm -rf build/web
            mkdir -p build/web
            cp -r "$TEMP_DEPLOY_DIR/uat/"* build/web/

          elif [ "$TARGET_ENV" = "dev" ]; then
            build_env "dev" "$BASE_HREF" "$TEMP_DEPLOY_DIR/dev"
            rm -rf build/web
            mkdir -p build/web
            cp -r "$TEMP_DEPLOY_DIR/dev/"* build/web/
          fi

          # GitHub Pages SPA 404 fallback routing
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll
          if [ -d "build/web/uat" ]; then
            touch build/web/uat/.nojekyll
            cp build/web/uat/index.html build/web/uat/404.html || true
          fi
          if [ -d "build/web/dev" ]; then
            touch build/web/dev/.nojekyll
            cp build/web/dev/index.html build/web/dev/404.html || true
          fi

      - name: Upload artifact for Actions deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4