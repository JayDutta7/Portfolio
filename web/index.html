<head>

  <!-- Preload hero image -->
  <link rel="preload" href="assets/images/picture.jpg" as="image">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Jayajit Dutta | Senior Android & Flutter Developer">
  <meta property="og:description" content="Senior Android & Flutter Developer with 9+ years of experience building scalable mobile and cross-platform applications.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Jayajit Dutta | Senior Android & Flutter Developer">
  <meta name="twitter:description" content="Senior Android & Flutter Developer with 9+ years of experience building scalable mobile and cross-platform applications.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jayajit Dutta | Senior Android & Flutter Developer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #050505;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.3s ease-out;
    }
    .loader {
      width: 80px;
      height: 80px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }
    .loader-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px solid rgba(99, 102, 241, 0.1);
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
    }
    .loader-ring-inner {
      position: absolute;
      width: 70%;
      height: 70%;
      border: 3px solid transparent;
      border-top-color: #14B8A6;
      border-radius: 50%;
      animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) reverse infinite;
    }
    .logo-text {
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: -1px;
    }
    .loading-text {
      color: #A3A3A3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div id="loading-indicator" class="loading">
    <div class="loader">
      <div class="loader-ring"></div>
      <div class="loader-ring-inner"></div>
      <div class="logo-text">JD</div>
    </div>
    <div class="loading-text">Initializing Engine</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('load', function() {
      // Ensure smooth removal when Flutter completes entrypoint initialization
      var checkFlutterLoaded = setInterval(function() {
        if (window._flutter && window._flutter.loader) {
          clearInterval(checkFlutterLoaded);
        }
      }, 50);

      // Fallback timer to hide loader cleanly if load takes place
      setTimeout(function() {
        var loading = document.querySelector('#loading-indicator');
        if (loading) {
          loading.style.opacity = '0';
          setTimeout(function() { loading.remove(); }, 300);
        }
      }, 800);
    });
  </script>
</body>
</html>
