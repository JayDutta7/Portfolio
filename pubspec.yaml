name: jayajit_portfolio
description: "Official developer portfolio of Jayajit Dutta — Senior Android & Flutter Developer."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  cupertino_icons: ^1.0.6
  url_launcher: ^6.2.6
  google_fonts: ^6.2.1
  path_provider: ^2.1.3
  open_file: ^3.5.11
  speech_to_text: ^7.4.0
  firebase_core: ^4.15.0
  firebase_database: ^12.6.0
  cloud_firestore: ^6.10.0
  sensors_plus: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/resume/Jayajit_Dutta_CV.pdf
    - assets/images/
    - assets/apk/JayajitDutta_Portfolio.apk
